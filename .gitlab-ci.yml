# QGroundControl-Bastion packages on the self-hosted GitLab.
#
# Runners (see FORK_CHANGES.md "GitLab CI"):
#   bastion-linux    Docker executor with privileged = true (Docker-in-Docker): AppImage, Android .apk
#                    and .deb, built in the Docker images from deploy/docker.
#                    Concurrent runners need their own dind storage volume each.
#   bastion-windows  Shell executor on Windows with Git, .NET SDK 8 and VS 2022 Build Tools: .msi.
#
# Optional CI/CD variables (Settings > CI/CD > Variables, masked):
#   BASTION_ANDROID_KEYSTORE (base64 .jks), BASTION_ANDROID_KEYSTORE_PASSWORD, BASTION_ANDROID_KEY_ALIAS
#   Without them the APK is signed with a throwaway key and cannot update an earlier install in place.
#
# Stages: AppImage, .apk and .msi build in parallel, each as its own artifact. Once the AppImage
# is ready, the deb job repackages it (no rebuild) as one .deb for Ubuntu 22.04, 24.04 and 26.04.
# The deb-native jobs are manual: a .deb compiled for one Ubuntu release against its system
# libraries; start them with the play button in the pipeline.
#
# Builder images: the Linux jobs push their builder image to the project's Container Registry as
# builder-<variant>:<branch> and reuse its layers (and the default branch's) on the next run, so all
# runners share one cache. Without the registry the jobs build as before.
#
# Versions: deploy/ci/version.sh, <QGC version>+bastion<BASTION_VERSION>[~<branch>]-<pipeline>.
#
# Pipelines run on pushes that touch the build, on "Run pipeline" and on bastion-vX.Y.Z tags; tags
# also publish the packages as a GitLab release.

workflow:
  rules:
    # Fork releases; plain vX.Y.Z tags are upstream QGroundControl's.
    - if: $CI_COMMIT_TAG =~ /^bastion-v[0-9]+\.[0-9]+\.[0-9]+$/
    - if: $CI_PIPELINE_SOURCE == "web"
    - if: $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH
      changes:
        - .gitlab-ci.yml
        - CMakeLists.txt
        - CMakePresets.json
        - android/**/*
        - cmake/**/*
        - deploy/**/*
        - resources/**/*
        - src/**/*
        - tools/**/*
        - translations/**/*
        - .github/build-config.json
        - BASTION_VERSION

stages:
  - build
  - packages
  - release

variables:
  # Package versions come from git describe, which needs the full history and tags.
  GIT_DEPTH: "0"
  # Keep compiler caches and downloads between runs in the runner's persistent build directory.
  GIT_CLEAN_FLAGS: -ffdx -e .ccache/ -e .cache/ -e .venv-ci/ -e build-msi/
  UPSTREAM_REPO: https://github.com/mavlink/qgroundcontrol.git

.linux:
  tags: [bastion-linux]
  # Docker-in-Docker: the job talks to its own dockerd service, which builds the builder images
  # from deploy/docker. The service shares /builds with the job, so the bind mounts done by
  # run_docker.py resolve. The runner needs privileged = true (see FORK_CHANGES.md "GitLab CI").
  image: docker:29.1.4
  services:
    - name: docker:29.1.4-dind
      alias: docker
  variables:
    DOCKER_HOST: tcp://docker:2375
    # The daemon is only reachable from this job's network, so TLS between them is not needed.
    DOCKER_TLS_CERTDIR: ""
    # /dev/fuse may be missing inside the dind daemon; AppImage packaging works without it.
    QGC_DOCKER_FUSE: "0"
  before_script:
    - apk add --no-cache bash coreutils curl dpkg git python3 > /dev/null
    - git config --global --add safe.directory "$CI_PROJECT_DIR"
    - |
      for _ in $(seq 30); do docker info > /dev/null 2>&1 && break; sleep 2; done
      if ! docker info > /dev/null 2>&1; then
        echo "The docker:dind service is not reachable at $DOCKER_HOST."
        echo "Set privileged = true under [runners.docker] in the runner's config.toml and restart the runner."
        exit 1
      fi
    # Shared builder-image cache in the Container Registry (run_docker.py reads these variables).
    - |
      if [ -n "${BUILDER_VARIANT:-}" ] && [ -n "${CI_REGISTRY:-}" ] \
          && echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY" > /dev/null 2>&1; then
        export IMAGE_NAME="$CI_REGISTRY_IMAGE/builder-$BUILDER_VARIANT:$CI_COMMIT_REF_SLUG"
        export DOCKER_CACHE_FROM="$IMAGE_NAME $CI_REGISTRY_IMAGE/builder-$BUILDER_VARIANT:$CI_DEFAULT_BRANCH"
        export DOCKER_PUSH_IMAGE=1
        echo "Builder image: $IMAGE_NAME"
      else
        echo "Container Registry unavailable, building the builder image without the shared cache."
      fi
    # Tag-less clones would package as 0.0.0; upstream tags are enough for git describe.
    - git fetch --no-tags "$UPSTREAM_REPO" "+refs/tags/v*:refs/tags/v*" || echo "Upstream tags unavailable, using local tags"

# Jobs that only package files: no Docker daemon needed.
.linux-tools:
  tags: [bastion-linux]
  image: alpine:3.22
  before_script:
    - apk add --no-cache bash binutils coreutils dpkg git python3 squashfs-tools xz > /dev/null
    - git config --global --add safe.directory "$CI_PROJECT_DIR"
    - git fetch --no-tags "$UPSTREAM_REPO" "+refs/tags/v*:refs/tags/v*" || echo "Upstream tags unavailable, using local tags"

appimage:
  extends: .linux
  stage: build
  timeout: 3h
  variables:
    BUILDER_VARIANT: ubuntu-2204
  script:
    # Built on Ubuntu 22.04: its older glibc makes the AppImage run on the most distributions.
    - export BUILD_DIR="$CI_PROJECT_DIR/build-appimage"
    - python3 deploy/docker/run_docker.py build ubuntu-2204
    # The job shell is POSIX sh (the image has no bash when the job starts).
    - |
      cd "$BUILD_DIR"
      set -- *.AppImage
      if [ "$#" -ne 1 ] || [ ! -f "$1" ]; then echo "error: expected one AppImage in $BUILD_DIR"; exit 1; fi
      version=$("$CI_PROJECT_DIR/deploy/ci/version.sh")
      mv "$1" "QGroundControl-Bastion-$version-x86_64.AppImage"
      sha256sum "QGroundControl-Bastion-$version-x86_64.AppImage" > "QGroundControl-Bastion-$version-x86_64.AppImage.sha256"
      cd "$CI_PROJECT_DIR"
  artifacts:
    name: qgroundcontrol-bastion-appimage
    paths:
      - build-appimage/*.AppImage
      - build-appimage/*.AppImage.sha256
    expire_in: 30 days

deb:
  extends: .linux-tools
  stage: packages
  needs: [appimage]
  timeout: 30m
  script:
    - version=$(deploy/ci/version.sh)
    - python3 deploy/ci/deb_from_appimage.py build-appimage/*.AppImage build-deb "$version"
    - (cd build-deb && for deb in *.deb; do sha256sum "$deb" > "$deb.sha256"; done)
  artifacts:
    name: qgroundcontrol-bastion-deb
    paths:
      - build-deb/*.deb
      - build-deb/*.deb.sha256
    expire_in: 30 days

deb-native:
  extends: .linux
  stage: packages
  needs: []
  when: manual
  allow_failure: true
  timeout: 3h
  parallel:
    matrix:
      - VARIANT: ubuntu-2204
        RELEASE: "22.04"
      - VARIANT: ubuntu
        RELEASE: "24.04"
      - VARIANT: ubuntu-2604
        RELEASE: "26.04"
  variables:
    BUILDER_VARIANT: $VARIANT
  script:
    - export BUILD_DIR="$CI_PROJECT_DIR/build-$VARIANT"
    - python3 deploy/docker/run_docker.py build "$VARIANT"
    - rm -f "$BUILD_DIR"/*.AppImage
    - deploy/ci/finalize-deb.sh "$BUILD_DIR" "$RELEASE" "$(deploy/ci/version.sh)"
  artifacts:
    name: qgroundcontrol-bastion-ubuntu$RELEASE
    paths:
      - build-$VARIANT/*.deb
      - build-$VARIANT/*.deb.sha256
    expire_in: 30 days

apk:
  extends: .linux
  stage: build
  timeout: 3h
  variables:
    BUILDER_VARIANT: android
  script:
    - export BUILD_DIR="$CI_PROJECT_DIR/build-apk"
    - python3 deploy/docker/run_docker.py build android
    - |
      export ANDROID_KEYSTORE_BASE64="${BASTION_ANDROID_KEYSTORE:-}"
      export ANDROID_KEYSTORE_PASSWORD="${BASTION_ANDROID_KEYSTORE_PASSWORD:-}"
      export ANDROID_KEY_ALIAS="${BASTION_ANDROID_KEY_ALIAS:-}"
      apk_name="QGroundControl-Bastion-$(deploy/ci/version.sh).apk"
      deploy/ci/sign-apk-docker.sh "$BUILD_DIR" "$apk_name"
      (cd "$BUILD_DIR" && sha256sum "$apk_name" > "$apk_name.sha256")
  artifacts:
    name: qgroundcontrol-bastion-android
    paths:
      - build-apk/QGroundControl-Bastion-*.apk
      - build-apk/QGroundControl-Bastion-*.apk.sha256
    expire_in: 30 days

msi:
  stage: build
  tags: [bastion-windows]
  timeout: 3h
  before_script:
    - git fetch --no-tags "$env:UPSTREAM_REPO" "+refs/tags/v*:refs/tags/v*"; if ($LASTEXITCODE -ne 0) { Write-Host "Upstream tags unavailable, using local tags" }
  script:
    - powershell -NoProfile -ExecutionPolicy Bypass -File deploy\ci\build-msi.ps1 -BuildDir "$env:CI_PROJECT_DIR\build-msi"
    - if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
  artifacts:
    name: qgroundcontrol-bastion-windows
    paths:
      - build-msi/*.msi
      - build-msi/*.msi.sha256
    expire_in: 30 days

release:
  stage: release
  tags: [bastion-linux]
  image: alpine:3.22
  before_script:
    - apk add --no-cache bash curl python3 > /dev/null
  rules:
    - if: $CI_COMMIT_TAG
  needs: [appimage, deb, apk, msi]
  script:
    - |
      if [ "$CI_COMMIT_TAG" != "bastion-v$(tr -d '[:space:]' < BASTION_VERSION)" ]; then
        echo "error: tag $CI_COMMIT_TAG does not match BASTION_VERSION $(cat BASTION_VERSION)"; exit 1
      fi
    - mkdir -p dist
    - find build-* -maxdepth 1 -type f \( -name '*.deb' -o -name '*.sha256' -o -name '*.AppImage' -o -name '*.apk' -o -name '*.msi' \) -exec cp {} dist/ \;
    - deploy/ci/publish-release.sh dist
