name: Bastion Packages

# Builds the QGroundControl-Bastion packages: Ubuntu .deb (+ AppImage) and Android .apk in
# the Docker builder images, and the Windows .msi on a Windows runner. Tags matching v*
# also publish all of them as a GitHub release.
#
# Runners default to GitHub-hosted ones. To build on your own machines, register
# self-hosted runners and set the repository variables (Settings > Secrets and variables >
# Actions > Variables) to their label:
#   BASTION_LINUX_RUNNER    e.g. bastion-linux   (Linux host with Docker; .deb and .apk)
#   BASTION_WINDOWS_RUNNER  e.g. bastion-windows (Windows with MSVC Build Tools)
# Self-hosted runners keep the build caches between runs. Never point pull_request
# workflows at them: this repository is public.
#
# Android signing secrets (optional; without them a throwaway key is used):
#   BASTION_ANDROID_KEYSTORE (base64 .jks), BASTION_ANDROID_KEYSTORE_PASSWORD, BASTION_ANDROID_KEY_ALIAS

on:
  workflow_dispatch:
  push:
    branches:
      - feat/multi-camera
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*'
    paths-ignore:
      - 'docs/**'
      - '*.md'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: read

env:
  UPSTREAM_REPO: https://github.com/mavlink/qgroundcontrol.git

jobs:
  deb:
    name: Ubuntu .deb
    runs-on: ${{ vars.BASTION_LINUX_RUNNER || 'ubuntu-24.04' }}
    timeout-minutes: 150
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Package versions come from git describe and need reachable tags.
          fetch-depth: 0
          persist-credentials: false
          # Keep .ccache / .cache (CPM, moccache) between runs on self-hosted runners.
          clean: ${{ runner.environment == 'github-hosted' }}

      # Forks start without tags, which leaves the package version at 0.0.0.
      - name: Fetch upstream version tags
        run: git fetch --no-tags "${UPSTREAM_REPO}" "+refs/tags/v*:refs/tags/v*"

      - name: Free Disk Space
        if: runner.environment == 'github-hosted'
        uses: ./.github/actions/free-disk-space

      - name: Build in Docker
        env:
          BUILD_DIR: ${{ runner.temp }}/build-deb
        run: python3 deploy/docker/run_docker.py build ubuntu

      - name: Check package identity
        env:
          BUILD_DIR: ${{ runner.temp }}/build-deb
        run: |
          shopt -s nullglob
          debs=("${BUILD_DIR}"/*.deb)
          if [ "${#debs[@]}" -ne 1 ]; then
            echo "::error::expected exactly one .deb, found ${#debs[@]}"
            exit 1
          fi
          name=$(dpkg-deb --field "${debs[0]}" Package)
          if [ "${name}" != "qgroundcontrol-bastion" ]; then
            echo "::error::unexpected package name '${name}'"
            exit 1
          fi
          dpkg-deb --contents "${debs[0]}" | grep -q './usr/bin/QGroundControl-Bastion ->'
          echo "Built ${debs[0]##*/}"

      - name: Upload
        uses: actions/upload-artifact@v7
        with:
          name: qgroundcontrol-bastion-linux
          path: |
            ${{ runner.temp }}/build-deb/*.deb
            ${{ runner.temp }}/build-deb/*.deb.sha256
            ${{ runner.temp }}/build-deb/*.AppImage
          if-no-files-found: error
          retention-days: 30

  apk:
    name: Android .apk
    runs-on: ${{ vars.BASTION_LINUX_RUNNER || 'ubuntu-24.04' }}
    timeout-minutes: 150
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
          clean: ${{ runner.environment == 'github-hosted' }}

      - name: Fetch upstream version tags
        run: git fetch --no-tags "${UPSTREAM_REPO}" "+refs/tags/v*:refs/tags/v*"

      - name: Free Disk Space
        if: runner.environment == 'github-hosted'
        uses: ./.github/actions/free-disk-space

      - name: Build in Docker
        env:
          BUILD_DIR: ${{ runner.temp }}/build-apk
        run: python3 deploy/docker/run_docker.py build android

      - name: Sign APK
        env:
          BUILD_DIR: ${{ runner.temp }}/build-apk
          ANDROID_KEYSTORE_BASE64: ${{ secrets.BASTION_ANDROID_KEYSTORE }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.BASTION_ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.BASTION_ANDROID_KEY_ALIAS }}
        run: |
          shopt -s nullglob
          apks=("${BUILD_DIR}"/android-build/*.apk)
          if [ "${#apks[@]}" -ne 1 ]; then
            echo "::error::expected exactly one APK in android-build, found ${#apks[@]}"
            exit 1
          fi
          docker run --rm --user "$(id -u):$(id -g)" --env HOME=/tmp \
            --env ANDROID_KEYSTORE_BASE64 --env ANDROID_KEYSTORE_PASSWORD --env ANDROID_KEY_ALIAS \
            -v "${PWD}:/project/source:ro" -v "${BUILD_DIR}:/project/build" \
            --entrypoint /bin/bash qgc-android-docker -l \
            /project/source/deploy/android/sign-apk.sh \
            "/project/build/android-build/${apks[0]##*/}" /project/build/QGroundControl-Bastion.apk

      - name: Upload
        uses: actions/upload-artifact@v7
        with:
          name: qgroundcontrol-bastion-android
          path: ${{ runner.temp }}/build-apk/QGroundControl-Bastion.apk
          if-no-files-found: error
          retention-days: 30

  msi:
    name: Windows .msi
    runs-on: ${{ vars.BASTION_WINDOWS_RUNNER || 'windows-2022' }}
    timeout-minutes: 150
    env:
      WIX_VERSION: '5.0.2'
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Fetch upstream version tags
        run: git fetch --no-tags "$env:UPSTREAM_REPO" "+refs/tags/v*:refs/tags/v*"

      - name: Build Setup
        uses: ./.github/actions/build-setup
        with:
          qt-host: windows
          qt-arch: win64_msvc2022_64
          build-type: Release

      # Idempotent so persistent self-hosted runners can reuse an existing installation.
      - name: Install WiX Toolset
        shell: pwsh
        run: |
          dotnet tool update --global wix --version $env:WIX_VERSION
          if ($LASTEXITCODE -ne 0) {
            dotnet tool install --global wix --version $env:WIX_VERSION
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          $wix = Join-Path $env:USERPROFILE '.dotnet\tools\wix.exe'
          foreach ($ext in 'WixToolset.UI.wixext', 'WixToolset.Util.wixext') {
            & $wix extension add -g "$ext/$env:WIX_VERSION"
            if ($LASTEXITCODE -ne 0 -and -not ((& $wix extension list -g) -match [regex]::Escape($ext))) {
              Write-Error "Failed to add WiX extension $ext"
              exit 1
            }
          }
          Split-Path $wix | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8

      - name: Configure
        uses: ./.github/actions/cmake-configure
        with:
          build-dir: ${{ runner.temp }}/build
          build-type: Release
          preset: Windows-msi
          extra-args: -DQGC_ENABLE_GST_VIDEOSTREAMING=ON

      - name: Build
        uses: ./.github/actions/cmake-build
        with:
          build-dir: ${{ runner.temp }}/build
          build-type: Release

      - name: Create MSI
        uses: ./.github/actions/cmake-build
        with:
          build-dir: ${{ runner.temp }}/build
          build-type: Release
          target: qgc-package
          parallel: 'false'

      - name: Upload
        uses: actions/upload-artifact@v7
        with:
          name: qgroundcontrol-bastion-windows
          path: |
            ${{ runner.temp }}/build/*.msi
            ${{ runner.temp }}/build/*.msi.sha256
          if-no-files-found: error
          retention-days: 30

  release:
    name: GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [deb, apk, msi]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Download packages
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: gh release create "${TAG}" dist/* --repo "${REPO}" --title "QGroundControl Bastion ${TAG}" --generate-notes
